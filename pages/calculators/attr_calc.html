<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <base href="../../">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="icon" href="/MaplestoryWiki/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/MaplestoryWiki/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>属性计算器</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #f0f9ff, #e0f7fa);
            color: #000;
            margin: 0;
            padding: 10px;
            font-weight: bold;
        }

        .content {
            background: transparent;
        }

        h1 {
            text-align: center;
            color: #000;
            font-size: 22px;
            margin: 6px 0 10px;
        }

        .subtitle {
            text-align: center;
            margin: 0 0 16px;
            font-size: 13px;
            color: #000;
            opacity: 0.8;
            font-weight: bold;
        }

        .calc-layout {
            max-width: 920px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .calc-card {
            background-color: #ffffffcc;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            padding: 12px;
        }

        .calc-card h2 {
            margin: 0 0 10px;
            font-size: 16px;
            color: #000;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 10px;
            padding: 6px 0;
        }

        .form-row label {
            font-weight: bold;
            color: #000;
            font-size: 14px;
            flex: 1 1 260px;
        }

        input[type="number"] {
            padding: 6px 8px;
            border: 1px solid #b2dfdb;
            border-radius: 6px;
            width: 160px;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #00796b;
            outline: none;
        }

        .btn {
            display: inline-block;
            padding: 10px 12px;
            background-color: #00796b;
            color: white;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 121, 107, 0.2);
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #004d40;
        }

        .btn-wide {
            width: 100%;
        }

        .btn-secondary {
            background-color: transparent;
            color: #00796b;
            border: 1px solid #00796b;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: #e0f2f1;
        }

        .extra-sub-block {
            display: none;
            margin-top: 10px;
            padding-left: 12px;
            border-left: 2px solid rgba(0, 0, 0, 0.2);
        }

        .result-box {
            margin-top: 10px;
            background-color: #ffffffcc;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            padding: 12px;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.5;
            min-height: 44px;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                align-items: stretch;
            }

            .form-row label {
                flex: 1 1 auto;
            }

            input[type="number"] {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- JavaScript 动态加载左侧目录 -->
    <div id="sidebar-container"></div>

    <!-- 页面内容区 -->
    <div class="content">
        <h1>属性计算器</h1>
        <p class="subtitle">用于计算两种属性的等比换算（攻击力 / 属性）</p>

        <div class="calc-layout">
            <div class="calc-card">
                <h2>攻击力</h2>
                <div class="form-row">
                    <label for="attack">基础攻击力</label>
                    <input type="number" id="attack" min="0" step="1" inputmode="numeric" />
                </div>
                <div class="form-row">
                    <label for="attackPct">攻击力百分比加成 (%)</label>
                    <input type="number" id="attackPct" step="0.1" inputmode="decimal" />
                </div>
            </div>

            <div class="calc-card">
                <h2>伤害加成</h2>
                <div class="form-row">
                    <label for="dmgPct">总伤害 (%)</label>
                    <input type="number" id="dmgPct" step="0.1" inputmode="decimal" />
                </div>
                <div class="form-row">
                    <label for="bossPct">BOSS伤害 (%)</label>
                    <input type="number" id="bossPct" step="0.1" inputmode="decimal" />
                </div>
            </div>

            <div class="calc-card">
                <h2>主属性</h2>
                <div class="form-row">
                    <label for="mainAttr">基础主属性</label>
                    <input type="number" id="mainAttr" min="0" step="1" inputmode="numeric" />
                </div>
                <div class="form-row">
                    <label for="mainAttrPct">主属性百分比加成 (%)</label>
                    <input type="number" id="mainAttrPct" step="0.1" inputmode="decimal" />
                </div>
                <div class="form-row">
                    <label for="extraMainAttr">不套用百分比主属性</label>
                    <input type="number" id="extraMainAttr" min="0" step="1" inputmode="numeric" />
                </div>
            </div>

            <div class="calc-card">
                <h2>副属性</h2>
                <div class="form-row">
                    <label for="subAttr">基础副属性</label>
                    <input type="number" id="subAttr" min="0" step="1" inputmode="numeric" />
                </div>
                <div class="form-row">
                    <label for="subAttrPct">副属性百分比加成 (%)</label>
                    <input type="number" id="subAttrPct" step="0.1" inputmode="decimal" />
                </div>
                <div class="form-row">
                    <label for="extraSubAttr">不套用百分比副属性</label>
                    <input type="number" id="extraSubAttr" min="0" step="1" inputmode="numeric" />
                </div>
            </div>

            <div class="calc-card">
                <h2>爆击</h2>
                <div class="form-row">
                    <label for="criDmg">爆击伤害 (%)</label>
                    <input type="number" id="criDmg" step="0.1" inputmode="decimal" />
                </div>
            </div>

            <div class="calc-card">
                <h2>双副属性（特定职业）</h2>
                <button type="button" class="btn btn-secondary btn-wide" onclick="toggleExtraSub()">我是暗影侠盗/影武者/卡蒂娜</button>
                <div id="extra-sub-block" class="extra-sub-block">
                    <div class="form-row">
                        <label for="subAttr2">基础副属性（副属性 2）</label>
                        <input type="number" id="subAttr2" min="0" step="1" inputmode="numeric" />
                    </div>
                    <div class="form-row">
                        <label for="subAttrPct2">副属性百分比加成（副属性 2, %）</label>
                        <input type="number" id="subAttrPct2" step="0.1" inputmode="decimal" />
                    </div>
                    <div class="form-row">
                        <label for="extraSubAttr2">附加副属性（副属性 2）</label>
                        <input type="number" id="extraSubAttr2" min="0" step="1" inputmode="numeric" />
                    </div>
                </div>
            </div>

            <div class="calc-card">
                <button type="button" class="btn btn-wide" onclick="calculateEquivalence()">计算等效属性</button>
                <pre id="result" class="result-box"></pre>
            </div>
        </div>
    </div>

    <script>
        // 加载侧边栏
        fetch('sidebar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('sidebar-container').innerHTML = data;
            })
            .catch(error => {
                console.error('加载侧边栏失败:', error);
            });

        // JavaScript 控制子菜单的展开和收起
        function toggleSubMenu(id) {
            const submenu = document.getElementById(id);
            if (submenu.style.display === "block") {
                submenu.style.display = "none";
            } else {
                submenu.style.display = "block";
            }
        }

        let extraSubEnabled = false;

        function toggleExtraSub() {
            extraSubEnabled = !extraSubEnabled;
            const block = document.getElementById("extra-sub-block");
            block.style.display = extraSubEnabled ? "block" : "none";
            localStorage.setItem("extraSubEnabled", String(extraSubEnabled));
        }

        function calculateEquivalence() {
            // 获取用户输入
            const attack = Number(document.getElementById("attack").value);
            const attackPct = Number(document.getElementById("attackPct").value) / 100;

            const dmgBonus = Number(document.getElementById("dmgPct").value) / 100;
            const bossBonus = Number(document.getElementById("bossPct").value) / 100;

            const mainAttr = Number(document.getElementById("mainAttr").value);
            const mainAttrPct = Number(document.getElementById("mainAttrPct").value) / 100;
            const extraMainAttr = Number(document.getElementById("extraMainAttr").value);

            const criDmg = (Number(document.getElementById("criDmg").value) + 35) / 100;

            const subAttr = Number(document.getElementById("subAttr").value);
            const subAttrPct = Number(document.getElementById("subAttrPct").value) / 100;
            const extraSubAttr = Number(document.getElementById("extraSubAttr").value);

            effSub = subAttr * (1 + subAttrPct) + extraSubAttr;
            let subAttr2 = 0
            let subAttrPct2 = 0
            let extraSubAttr2 = 0
            // 双副属性
            if (extraSubEnabled) {
                subAttr2 = Number(document.getElementById("subAttr2").value);
                subAttrPct2 = Number(document.getElementById("subAttrPct2").value) / 100;
                extraSubAttr2 = Number(document.getElementById("extraSubAttr2").value);
            }
            effSub += subAttr2 * (1 + subAttrPct2) + extraSubAttr2;

            // 当前状态
            const effMain = mainAttr * (1 + mainAttrPct) + extraMainAttr;
            const totalAttr = effMain * 4 + effSub;
            const effAtk = attack * (1 + attackPct);
            const effDmgBonus = dmgBonus + bossBonus;
            const baseOutput = effAtk * totalAttr * (1 + effDmgBonus) * (1 + criDmg);

            // +1 攻击力
            const atkUp = (attack + 1) * (1 + attackPct) * totalAttr * (1 + effDmgBonus) * (1 + criDmg);
            const atkGain = atkUp - baseOutput;

            // +1% 攻击力
            const atkPctUp = attack * (1 + attackPct + 0.01) * totalAttr * (1 + effDmgBonus) * (1 + criDmg);
            const atkPctGain = atkPctUp - baseOutput;

            // +1% 爆伤
            const criDmgUp = attack * (1 + attackPct) * totalAttr * (1 + effDmgBonus) * (1 + criDmg + 0.01);
            const criDmgGain = criDmgUp - baseOutput;

            // +1% Dmg
            const dmgUp = attack * (1 + attackPct) * totalAttr * (1 + effDmgBonus + 0.01) * (1 + criDmg);
            const dmgGain = dmgUp - baseOutput;

            // +1主属性
            const mainUp = (mainAttr + 1) * (1 + mainAttrPct) + extraMainAttr;
            const newTotalAttrMain = mainUp * 4 + effSub;
            const attrUp = effAtk * newTotalAttrMain * (1 + effDmgBonus) * (1 + criDmg);
            const attrGain = attrUp - baseOutput;

            // +1%主属性
            const mainPctUp = mainAttr * (1 + mainAttrPct + 0.01) + extraMainAttr;
            const newTotalAttrMainPct = mainPctUp * 4 + effSub;
            const mainPctOutput = effAtk * newTotalAttrMainPct * (1 + effDmgBonus) * (1 + criDmg);
            const mainPctGain = mainPctOutput - baseOutput;

            // +1%全属性
            const mainAllPct = mainAttr * (1 + mainAttrPct + 0.01) + extraMainAttr;
            const subAllPct = subAttr * (1 + subAttrPct + 0.01) + extraSubAttr;
            const subAllPct2 = subAttr2 * (1 + subAttrPct2 + 0.01) + extraSubAttr2;
            const totalAttrAllPct = mainAllPct * 4 + subAllPct + subAllPct2;
            const allPctOutput = effAtk * totalAttrAllPct * (1 + effDmgBonus) * (1 + criDmg);
            const allPctGain = allPctOutput - baseOutput;

            document.getElementById("result").innerText =
                `🧮 当前输出:${baseOutput.toFixed(2)}\n\n` +
                `📌 +1 攻击力:输出 ${atkUp.toFixed(2)}，提升 ${atkGain.toFixed(2)}\n` +
                `📌 +1% 攻击力:输出 ${atkPctUp.toFixed(2)}，提升 ${atkPctGain.toFixed(2)}\n` +
                `📌 +1% BOSS:输出 ${dmgUp.toFixed(2)}，提升 ${dmgGain.toFixed(2)}\n` +
                `📌 +1% 爆伤:输出 ${criDmgUp.toFixed(2)}，提升 ${criDmgGain.toFixed(2)}\n` +
                `📌 +1 主属性:输出 ${attrUp.toFixed(2)}，提升 ${attrGain.toFixed(2)}\n` +
                `📌 +1% 主属性:输出 ${mainPctOutput.toFixed(2)}，提升 ${mainPctGain.toFixed(2)}\n` +
                `📌 +1% 全属性:输出 ${allPctOutput.toFixed(2)}，提升 ${allPctGain.toFixed(2)}\n\n` +
                `✅ 常见等效换算:\n` +
                `1 攻击力 ≈ ${attrGain > 0 ? (atkGain / attrGain).toFixed(2) : 'N/A'} 主属性\n` +
                `1 %攻击力 ≈ ${atkGain > 0 ? (atkPctGain / atkGain).toFixed(2) : 'N/A'} 攻击力\n` +
                `40 BOSS伤 ≈ ${atkPctGain > 0 ? (dmgGain / atkPctGain * 40).toFixed(2) : 'N/A'} %攻击力\n` +
                `1 %爆伤 ≈ ${mainPctGain > 0 ? (criDmgGain / mainPctGain).toFixed(2) : 'N/A'}% 主属性\n` +
                `1 %主属性 ≈ ${attrGain > 0 ? (mainPctGain / attrGain).toFixed(2) : 'N/A'} 主属性\n` +
                `1 %全属性 ≈ ${mainPctGain > 0 ? (allPctGain / mainPctGain).toFixed(2) : 'N/A'}% 主属性\n` +
                `1 %全属性 ≈ ${mainPctGain > 0 ? (allPctGain / attrGain).toFixed(2) : 'N/A'} 主属性`;

            saveInputsToLocalStorage()
        }

        function saveInputsToLocalStorage() {
            const ids = [
                "attack", "attackPct",
                "dmgPct", "bossPct",
                "mainAttr", "mainAttrPct", "extraMainAttr",
                "subAttr", "subAttrPct", "extraSubAttr",
                "subAttr2", "subAttrPct2", "extraSubAttr2",
                "criDmg"
            ];
            ids.forEach(id => {
                const value = document.getElementById(id).value;
                localStorage.setItem(id, value);
            });
            localStorage.setItem("extraSubEnabled", String(extraSubEnabled));
        }

        function loadInputsFromLocalStorage() {
            const ids = [
                "attack", "attackPct",
                "dmgPct", "bossPct",
                "mainAttr", "mainAttrPct", "extraMainAttr",
                "subAttr", "subAttrPct", "extraSubAttr",
                "subAttr2", "subAttrPct2", "extraSubAttr2",
                "criDmg"
            ];
            ids.forEach(id => {
                if (localStorage.getItem(id) !== null) {
                    document.getElementById(id).value = localStorage.getItem(id);
                }
            });

            const showExtraSub = localStorage.getItem("extraSubEnabled") === "true";
            if (showExtraSub) {
                toggleExtraSub(); // 触发展开
            }
        }

        window.onload = loadInputsFromLocalStorage;
    </script>
</body>

</html>
