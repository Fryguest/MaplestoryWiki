<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <base href="../../">
    <link rel="stylesheet" href="static/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>装备收益计算器</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px 24px 24px 244px; background: #eef8fa; color: #183535; font-family: Arial, sans-serif; }
        main { max-width: 1200px; margin: auto; }
        h1 { font-size: 24px; }
        h2 { font-size: 18px; margin-top: 0; }
        section, article { padding: 20px; margin-bottom: 16px; background: white; border-radius: 12px; }
        .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 12px; }
        label { display: grid; gap: 6px; font-size: 13px; }
        input, select, button { padding: 9px; border: 1px solid #bddbd7; border-radius: 6px; font: inherit; min-width: 0; }
        input, select { width: 100%; }
        button { background: #00796b; color: white; cursor: pointer; }
        button:disabled { opacity: .5; cursor: wait; }
        #name { width: 240px; }
        #status { color: #b00020; }
        .equip-head { justify-content: space-between; margin-bottom: 12px; }
        .equip-head select { width: 120px; }
        summary { cursor: pointer; margin: 12px 0; }
        .equip-compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
        .equip-side { min-width: 0; padding: 16px; background: #f5faf9; border-radius: 10px; }
        .equip-side h3 { margin: 0 0 12px; font-size: 15px; }
        .equip-identity { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .equip-icon-box { width: 56px; height: 56px; flex: 0 0 56px; display: grid; place-items: center; background: #e7f1ef; border-radius: 8px; }
        .equip-icon { width: 40px; height: 40px; object-fit: contain; }
        .equip-identity input { flex: 1; }
        .equip-values { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
        .equip-value { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
        .equip-potentials { font-size: 13px; line-height: 1.7; white-space: pre-line; }
        .candidate .grid { margin-top: 12px; }
        .familiar-options { padding-left: 20px; font-size: 13px; line-height: 1.7; }
        .familiar-option-input { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; margin-top: 8px; }
        .results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .results strong { display: block; font-size: 24px; margin-top: 8px; overflow-wrap: anywhere; }
        .panel-results { grid-column: 1 / -1; overflow-x: auto; }
        .panel-results table { width: 100%; min-width: 420px; border-collapse: collapse; }
        .panel-results th, .panel-results td { padding: 8px; border-bottom: 1px solid #bddbd7; }
        .panel-results th { text-align: left; }
        .panel-results td { text-align: right; }
        [hidden] { display: none !important; }
        @media (max-width: 600px) { body { padding: 12px; } .sidebar { position: static; width: auto; height: auto; padding-top: 12px; } .results { grid-template-columns: 1fr; } }
        @media (max-width: 760px) { .equip-compare { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div id="sidebar-container"></div>
<main>
    <h1>装备收益计算器</h1>
    <section>
        <div class="row">
            <input id="name" placeholder="角色名字" aria-label="角色名字">
            <button id="query" type="button">导入当前装备</button>
            <span id="character"></span>
        </div>
        <p id="status" role="status"></p>
    </section>
    <form id="calculator">
        <section>
            <h2>当前属性与木桩</h2>
            <div class="grid">
                <label>职业<input id="jobInfo" type="text" readonly></label>
                <label>主属性<input id="mainStatDisplay" type="text" readonly></label>
                <label>副属性<input id="subStatDisplay" type="text" readonly></label>
                <label>攻击类型<input id="attackTypeDisplay" type="text" readonly></label>
            </div>
            <div id="baseline" class="grid" style="margin-top:12px"></div>
        </section>
        <section>
            <button id="calculate" type="submit" disabled>计算换装收益</button>
            <p id="error" role="alert"></p>
            <div id="result" class="results" hidden>
                <div>当前伤害<strong id="oldDamage"></strong></div>
                <div>预计伤害<strong id="newDamage"></strong></div>
                <div>提升比例<strong id="gain"></strong></div>
                <div class="panel-results">
                    <h3>换装前后面板</h3>
                    <table>
                        <thead><tr><th scope="col">属性</th><th scope="col">当前面板</th><th scope="col">换装后面板</th></tr></thead>
                        <tbody id="panelRows"></tbody>
                    </table>
                </div>
                <div class="panel-results">
                    <h3>触发的套装</h3>
                    <div class="equip-compare">
                        <div class="equip-side"><h4>换装前</h4><ul id="beforeSets"></ul></div>
                        <div class="equip-side"><h4>换装后</h4><ul id="afterSets"></ul></div>
                    </div>
                </div>
            </div>
        </section>
        <section>
            <h2>装备替换</h2>
            <div id="equipment"></div>
        </section>
        <section>
            <h2>萌兽替换</h2>
            <div id="familiars"></div>
            <button id="addFamiliar" type="button" disabled>新增候选萌兽</button>
        </section>
    </form>
</main>
<script>
    const $ = id => document.getElementById(id);
    const attributes = ["str", "dex", "int", "luk"];
    let equipmentFields = [];

    function getEquipmentFields(job) {
        const attackLabel = job.attack_type === "magic_power" ? "魔法攻击力" : "攻击力";
        return [
            ...[...job.main_attr, ...job.sub_attr].flatMap(key => [
                [key, key.toUpperCase()],
                [key + "_pct", key.toUpperCase() + "%"]
            ]),
            ["all_stat", "全属性"],
            ["all_pct", "全属性%"],
            [job.attack_type, attackLabel],
            [job.attack_type + "_pct", attackLabel + "%"],
            ["damage", "伤害%"],
            ["boss", "BOSS伤害%"],
            ["crit_damage", "暴击伤害%"],
            ["ied", "无视防御力%"]
        ];
    }
    const baselineFields = [
        ["damage", "伤害%"], ["boss", "BOSS伤害%"],
        ["crit_damage", "暴击伤害%"],
        ["final_damage", "最终伤害%"],
        ["ied", "无视防御%"], ["defense", "木桩防御率%"], ["measured", "实测总伤害"]
    ];
    let rows = [];
    let outfit = null;
    let currentJob = null;
    let jobList = null;
    let setList = null;
    const cacheKey = "equip_damage_calc_state_v2";
    let importedItems = null;
    let importedClass = "";
    let importedFamiliars = null;
    let familiarRows = [];

    function normalizeJobName(value) {
        return String(value || "").normalize("NFKC").replace(/[\s、，,]/g, "");
    }

    async function loadJobList() {
        if (jobList) return jobList;
        const response = await fetch("data/job_list.json");
        if (!response.ok) throw Error("职业数据读取失败");
        const data = await response.json();
        if (!Array.isArray(data)) throw Error("职业数据格式错误");
        jobList = data;
        return jobList;
    }
    async function loadSetList() {
        if (setList) return setList;
        const response = await fetch("data/equipment/equipment_sets.json");
        if (!response.ok) throw Error("套装数据读取失败");
        const data = await response.json();
        if (!Array.isArray(data)) throw Error("套装数据格式错误");
        setList = data;
        return setList;
    }

    function applyJob(className, jobs) {
        $("jobInfo").value = className || "";
        const job = jobs.find(item =>
            normalizeJobName(item.tw_name) === normalizeJobName(className)
        );
        if (!job) throw Error(`未匹配职业：${className || "未知"}`);
        $("mainStatDisplay").value = job.main_attr.map(key => key.toUpperCase()).join(" / ");
        $("subStatDisplay").value = job.sub_attr.map(key => key.toUpperCase()).join(" / ") || "无";
        $("attackTypeDisplay").value = job.attack_type === "magic_power" ? "魔法攻击" : "物理攻击";
        if (["傑諾", "惡魔復仇者"].includes(job.tw_name)) {
            throw Error(`暂不支持${job.tw_name}的伤害计算`);
        }
        if (
            !Array.isArray(job.main_attr) || job.main_attr.length !== 1 ||
            !Array.isArray(job.sub_attr) || !job.sub_attr.length ||
            ![...job.main_attr, ...job.sub_attr].every(key => attributes.includes(key)) ||
            new Set([...job.main_attr, ...job.sub_attr]).size !== job.main_attr.length + job.sub_attr.length ||
            !["attack_power", "magic_power"].includes(job.attack_type)
        ) throw Error("职业属性配置不支持");
        currentJob = job;
        equipmentFields = getEquipmentFields(job);
        const statFields = [...job.main_attr, ...job.sub_attr].flatMap(key => {
            const label = `${job.main_attr.includes(key) ? "主" : "副"}属性${key.toUpperCase()}`;
            return [
                [key, `基础${label}`],
                [key + "_pct", `${label}%`],
                [key + "_fixed", `不受%加成的${key.toUpperCase()}`]
            ];
        });
        const attackLabel = job.attack_type === "magic_power" ? "魔法攻击力" : "攻击力";
        $("baseline").replaceChildren();
        baseline = makeFields($("baseline"), [
            ...statFields,
            ["attack", `基础${attackLabel}`],
            ["attack_pct", `${attackLabel}%`],
            ...baselineFields
        ]);
    }
    function makeFields(container, defs, values = {}) {
        const inputs = {};
        for (const [key, text] of defs) {
            const label = document.createElement("label");
            label.textContent = text;
            const input = document.createElement("input");
            input.type = "number";
            input.step = "any";
            input.min = "0";
            input.required = true;
            input.value = values[key] ?? 0;
            if (key === "ied") input.max = "100";
            label.append(input);
            container.append(label);
            inputs[key] = input;
        }
        return inputs;
    }
    let baseline = {};
    function values(inputs) {
        return Object.fromEntries(Object.entries(inputs).map(([key, input]) => {
            const n = Number(input.value);
            if (!input.value.trim() || !Number.isFinite(n) || n < 0) throw Error("请填写有效的非负数值");
            return [key, n];
        }));
    }
    function number(v) {
        const n = Number(String(v ?? 0).replaceAll(",", "").replace("%", ""));
        return Number.isFinite(n) ? n : 0;
    }
    function parseFamiliarOptions(options) {
        if (!Array.isArray(options)) throw Error("萌兽词条数据格式错误");
        const aliases = {
            STR: "str", DEX: "dex", INT: "int", LUK: "luk",
            "全屬性": "all_stat", "全部屬性": "all_stat",
            "攻擊力": "attack_power", "物理攻擊力": "attack_power",
            "魔法攻擊力": "magic_power",
            "傷害": "damage",
            "BOSS怪物傷害": "boss", "BOSS傷害": "boss",
            "爆擊傷害": "crit_damage", "暴擊傷害": "crit_damage",
            "無視怪物防禦率": "ied", "無視防禦率": "ied",
            "最終傷害": "final_damage"
        };
        const percentOnly = new Set([
            "damage", "boss", "crit_damage", "ied", "final_damage"
        ]);
        return options.map(option => {
            const rawName = String(option?.option_name ?? "");
            const rawValue = String(option?.option_value ?? "");
            const name = rawName.normalize("NFKC").replace(/\s+/g, "");
            const percent = name.endsWith("(%)");
            const label = percent ? name.slice(0, -3) : name;
            const passive = label === "依照被動技能來增加";
            const baseKey = passive ? "passive_skill_level"
                : aliases[label.toUpperCase()] ?? aliases[label] ?? null;
            let key = baseKey && (passive || percent || !percentOnly.has(baseKey))
                ? baseKey : null;
            if (key === "all_stat" && percent) {
                key = "all_pct";
            } else if (percent && (
                ["str", "dex", "int", "luk", "attack_power", "magic_power"].includes(key)
            )) {
                key += "_pct";
            }
            const text = rawValue.trim();
            const numeric = /^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(text);
            const value = numeric ? Number(text) : null;
            if (key && (!numeric || !Number.isFinite(value))) {
                throw Error(`萌兽词条数值无效：${rawName} ${rawValue}`);
            }
            return {
                no: option?.option_no ?? null,
                rawName,
                rawValue,
                key: key ?? "unknown",
                unit: key ? (passive ? "level" : percent ? "percent" : "flat") : null,
                value
            };
        });
    }
    function familiarIsActive(familiar, slots) {
        if (familiar.summoned_flag === "true") return true;
        if (familiar.summoned_flag !== "false") return false;
        return slots.some(slot =>
            slot.slot_id === familiar.slot_id && slot.active_flag === "true"
        );
    }
    function familiarOptionInputs(container) {
        return Array.from({ length: 3 }, (_, index) => {
            const line = document.createElement("div");
            line.className = "familiar-option-input";
            const name = document.createElement("input");
            name.placeholder = `词条${index + 1}名称（如：最終傷害 (%)）`;
            name.setAttribute("aria-label", `词条${index + 1}名称`);
            const value = document.createElement("input");
            value.type = "number";
            value.step = "any";
            value.min = "0";
            value.placeholder = "数值";
            value.setAttribute("aria-label", `词条${index + 1}数值`);
            line.append(name, value);
            container.append(line);
            return { name, value };
        });
    }
    function candidateFamiliarOptions(row) {
        return row.options.flatMap(({ name, value }, index) => {
            const option_name = name.value.trim();
            const option_value = value.value.trim();
            if (!option_name && !option_value) return [];
            if (!option_name || !option_value) {
                throw Error(`请完整填写候选萌兽词条${index + 1}`);
            }
            return [{ option_no: index + 1, option_name, option_value }];
        });
    }
    function addFamiliarRow(familiar = null) {
        const card = document.createElement("article");
        const head = document.createElement("div");
        head.className = "row equip-head";
        const title = document.createElement("strong");
        title.textContent = familiar?.familiar_name || "新增萌兽";
        const mode = document.createElement("select");
        mode.setAttribute("aria-label", `${title.textContent}操作`);
        for (const [value, label] of familiar
            ? [["keep", "保留"], ["remove", "移除"], ["replace", "替换"]]
            : [["replace", "新增"]]) {
            mode.add(new Option(label, value));
        }
        head.append(title, mode);
        if (!familiar) {
            const remove = document.createElement("button");
            remove.type = "button";
            remove.textContent = "删除候选";
            remove.onclick = () => {
                familiarRows = familiarRows.filter(row => row.mode !== mode);
                card.remove();
                $("result").hidden = true;
                saveState();
            };
            head.append(remove);
        }
        const compare = document.createElement("div");
        compare.className = "equip-compare";
        const left = document.createElement("div");
        left.className = "equip-side";
        const leftTitle = document.createElement("h3");
        leftTitle.textContent = "当前萌兽";
        const original = document.createElement("p");
        original.textContent = familiar
            ? `${familiar.familiar_name || "未命名萌兽"}（${familiar.familiar_nickname || "无昵称"}；${familiar.summoned_flag === "true" ? "已召唤" : `链路 ${familiar.slot_id}`}）`
            : "无";
        left.append(leftTitle, original);
        if (familiar) {
            const list = document.createElement("ul");
            list.className = "familiar-options";
            for (const option of familiar.option) {
                const entry = document.createElement("li");
                entry.textContent = `${option.option_name}：${option.option_value}`;
                list.append(entry);
            }
            left.append(list);
        }
        const right = document.createElement("div");
        right.className = "equip-side";
        const rightTitle = document.createElement("h3");
        rightTitle.textContent = "候选萌兽词条";
        const state = document.createElement("p");
        const candidate = document.createElement("div");
        candidate.className = "candidate";
        const options = familiarOptionInputs(candidate);
        const updateMode = () => {
            candidate.hidden = mode.value !== "replace";
            state.hidden = mode.value === "replace";
            state.textContent = mode.value === "remove" ? "不使用此萌兽" : "保留当前萌兽";
            for (const input of candidate.querySelectorAll("input")) {
                input.disabled = mode.value !== "replace";
            }
            $("result").hidden = true;
        };
        mode.onchange = updateMode;
        updateMode();
        right.append(rightTitle, state, candidate);
        compare.append(left, right);
        card.append(head, compare);
        $("familiars").append(card);
        const row = { familiar, mode, options };
        familiarRows.push(row);
        return row;
    }
    function renderFamiliars(data) {
        if (!Array.isArray(data?.familiar_info) ||
            !Array.isArray(data.familiar_link_slot)) {
            throw Error("萌兽数据格式错误");
        }
        importedFamiliars = data;
        familiarRows = [];
        $("familiars").replaceChildren();
        for (const familiar of data.familiar_info) {
            if (familiarIsActive(familiar, data.familiar_link_slot)) {
                addFamiliarRow(familiar);
            } else {
                const card = document.createElement("article");
                const title = document.createElement("strong");
                title.textContent = `${familiar.familiar_name || "未命名萌兽"}（未生效）`;
                const list = document.createElement("ul");
                list.className = "familiar-options";
                for (const option of familiar.option) {
                    const entry = document.createElement("li");
                    entry.textContent = `${option.option_name}：${option.option_value}`;
                    list.append(entry);
                }
                card.append(title, list);
                $("familiars").append(card);
            }
        }
        $("addFamiliar").disabled = false;
    }
    function equipmentValues(item) {
        const out = Object.fromEntries(equipmentFields.map(([k]) => [k, 0]));
        const selectedStats = [...currentJob.main_attr, ...currentJob.sub_attr];
        const unparsed = [];
        const add = (key, value) => {
            if (!Object.hasOwn(out, key)) return;
            if (key === "ied") {
                out.ied = 100 * (1 - (1 - out.ied / 100) * (1 - value / 100));
            } else {
                out[key] += value;
            }
        };
        const addAll = (value, percent) => {
            add(percent ? "all_pct" : "all_stat", value);
        };
        const total = item.item_total_option || {};
        for (const key of selectedStats) add(key, number(total[key]));
        add(currentJob.attack_type, number(total[currentJob.attack_type]));
        addAll(number(total.all_stat), true);
        add("damage", number(total.damage));
        add("boss", number(total.boss_damage));
        add("ied", number(total.ignore_monster_armor));

        const optionKeys = {
            "攻擊力": "attack_power",
            "攻击力": "attack_power",
            "物理攻擊力": "attack_power",
            "物理攻击力": "attack_power",
            "魔法攻擊力": "magic_power",
            "魔法攻击力": "magic_power",
            "傷害": "damage",
            "伤害": "damage",
            "總傷害": "damage",
            "总伤害": "damage",
            "BOSS傷害": "boss",
            "BOSS伤害": "boss",
            "BOSS怪物傷害": "boss",
            "BOSS怪物伤害": "boss",
            "攻擊BOSS怪物時傷害": "boss",
            "攻击BOSS怪物时伤害": "boss",
            "爆擊傷害": "crit_damage",
            "暴擊傷害": "crit_damage",
            "暴击伤害": "crit_damage",
            "爆击伤害": "crit_damage",
            "無視防禦": "ied",
            "無視防禦率": "ied",
            "無視怪物防禦率": "ied",
            "怪物無視防禦率": "ied",
            "无视防御": "ied",
            "无视防御率": "ied",
            "无视怪物防御率": "ied"
        };
        const ignoredLabels = new Set([
            "道具掉落率", "楓幣獲得量", "枫币获得量",
            "移動速度", "移动速度", "跳躍力", "跳跃力",
            "防禦力", "防御力", "MAXHP", "MAXMP",
            "爆擊率", "暴擊率", "暴击率", "爆击率",
            "一般怪物傷害", "一般怪物伤害"
        ]);
        const options = [
            item.potential_option_1, item.potential_option_2, item.potential_option_3,
            item.additional_potential_option_1, item.additional_potential_option_2,
            item.additional_potential_option_3
        ];
        for (const option of options) {
            const raw = String(option || "").trim();
            if (!raw) continue;
            const text = raw.normalize("NFKC").replace(/\s/g, "").toUpperCase();

            // 按约定固定折算为32倍，不依赖角色等级。
            const level = text.match(/^(?:以角色等級為準|以角色等级为准)?每9[級级](STR|DEX|INT|LUK)(?::\+?|\+)(\d+(?:\.\d+)?)$/);
            if (level) {
                add(level[1].toLowerCase(), Number(level[2]) * 32);
                continue;
            }

            const match = text.match(/^(.+?)(?::\+?|\+)(\d+(?:\.\d+)?)(%)?$/);
            if (!match) {
                unparsed.push(raw);
                continue;
            }
            const label = match[1];
            const value = Number(match[2]);
            const percent = Boolean(match[3]);
            if (ignoredLabels.has(label)) continue;

            const stat = label.toLowerCase();
            if (attributes.includes(stat)) {
                add(stat + (percent ? "_pct" : ""), value);
                continue;
            }
            if (["全屬性", "全部屬性", "全属性", "全部属性"].includes(label)) {
                addAll(value, percent);
                continue;
            }
            const key = optionKeys[label];
            if (!key) {
                unparsed.push(raw);
                continue;
            }
            if (["attack_power", "magic_power"].includes(key)) {

            (member.slot === "套服" && slot === "上衣") ||
            (member.slot === "褲/裙" &&
                ["褲子", "裙子", "下衣"].includes(item.part));

            ? member.contains?.some(word => item.name.includes(word)) === true
            : item.name === member.name;

    function evaluateSets(itemForRow, extraItems = []) {
        const equipped = rows.map(itemForRow).filter(Boolean).concat(extraItems);
        return setList.map(set => {
            const count = set.items.filter(member =>
                equipped.some(item => matchesSetItem(item, member))
            ).length;
            const tiers = Object.entries(set.effects).filter(
                ([threshold]) => Number(threshold) <= count
            );
            return { set, count, tiers };
        });
    }

    function applySetTier(stats, sign, delta, remainingDefense) {
        for (const [key, value] of Object.entries(stats)) {
            if (key === "ied") {
                if (sign < 0 && value >= 100) {
                    throw Error("无法从100%套装无视反推换装结果");
                }
                remainingDefense *= sign > 0
                    ? 1 - value / 100 : 1 / (1 - value / 100);
            } else if (Object.hasOwn(delta, key)) {
                delta[key] += sign * value;
            }
        }
        return remainingDefense;
    }

    async function getKey() {
        const response = await fetch("new_attr_calc.html");

        const source = await response.text();
        const block = source.match(/const NX_API_KEY_B64_PARTS\s*=\s*\[([\s\S]*?)\]/);
        const parts = block?.[1].match(/"([^"]*)"/g);
        if (!parts) throw Error("未找到 API Key");
        return atob(parts.map(part => JSON.parse(part)).join(""));

                });
                const base = b[key];
                current[key] = base * (1 + b[key + "_pct"] / 100) + b[key + "_fixed"];
                const pct = b[key + "_pct"] + delta[key + "_pct"] + delta.all_pct;
                const flat = base + delta[key] + delta.all_stat;
                console.log("[装备收益] 属性重算", {
                    属性: key.toUpperCase(),
                    输入基础属性: base,
                    装备属性差值: delta[key],
                    全属性差值: delta.all_stat,
                    装备属性百分比差值: delta[key + "_pct"],
                    全属性百分比差值: delta.all_pct,
                    换装后基础属性: flat,
                    换装后属性百分比: pct,
                    换装后面板属性: flat * (1 + pct / 100) + b[key + "_fixed"]
                });
                if (flat < 0) throw Error(`换装后基础${key.toUpperCase()}被算成负数：${Number(flat.toFixed(4))}`);
                if (pct < 0) throw Error(`换装后${key.toUpperCase()}%被算成负数：${Number(pct.toFixed(4))}%`);
                next[key] = flat * (1 + pct / 100) + b[key + "_fixed"];
            }
            const attackKey = currentJob.attack_type;
            current.attack = b.attack * (1 + b.attack_pct / 100);
            const attackBase = b.attack + delta[attackKey];
            const attackPct = b.attack_pct + delta[attackKey + "_pct"];
            console.log("[装备收益] 攻击力重算", {
                攻击类型: attackKey,
                输入基础攻击力: b.attack,
                输入攻击力百分比: b.attack_pct,
                装备攻击力差值: delta[attackKey],
                装备攻击力百分比差值: delta[attackKey + "_pct"],
                换装后基础攻击力: attackBase,
                换装后攻击力百分比: attackPct
            });
            const attackLabel = attackKey === "magic_power" ? "魔法攻击力" : "攻击力";
            if (attackBase < 0) throw Error(`换装后基础${attackLabel}被算成负数：${Number(attackBase.toFixed(4))}`);
            if (attackPct < 0) throw Error(`换装后${attackLabel}%被算成负数：${Number(attackPct.toFixed(4))}%`);
            next.attack = attackBase * (1 + attackPct / 100);
            for (const k of ["damage", "boss", "crit_damage"]) {
                next[k] += delta[k];
                if (next[k] < 0) {
                    const label = { damage: "伤害", boss: "BOSS伤害", crit_damage: "暴击伤害" }[k];
                    throw Error(`换装后${label}被算成负数：${Number(next[k].toFixed(4))}%`);
                }
            }
            next.final_damage = (
                (1 + b.final_damage / 100)
                * (1 + familiarFinalAfter / 100)
                / (1 + familiarFinalBefore / 100) - 1
            ) * 100;
            next.ied = (1 - remainingDefense) * 100;
            if (next.ied < -0.000001) throw Error(`换装后无视防御力被算成负数：${Number(next.ied.toFixed(4))}%`);
            if (next.ied > 100) throw Error(`换装后无视防御力超过100%：${Number(next.ied.toFixed(4))}%`);
            const statFactor = s => 4 * s[currentJob.main_attr[0]]
                + currentJob.sub_attr.reduce((sum, key) => sum + s[key], 0);
            const score = s => statFactor(s) * s.attack
                * (1 + (s.damage + s.boss) / 100)
                * (1.35 + s.crit_damage / 100)
                * (1 + s.final_damage / 100)
                * Math.max(0, 1 - s.defense / 100 * (1 - s.ied / 100));
            const before = score(current), ratio = score(next) / before;
            if (!(before > 0) || !(b.measured > 0) || !Number.isFinite(ratio)) throw Error("请检查基准属性、木桩防御率和伤害");
            const format = n => n.toLocaleString("zh-CN", { maximumFractionDigits: 0 });
            $("oldDamage").textContent = format(b.measured);
            $("newDamage").textContent = format(b.measured * ratio);
            $("gain").textContent = `${ratio >= 1 ? "+" : ""}${((ratio - 1) * 100).toFixed(2)}%`;
            const panelFields = [
                ...[...currentJob.main_attr, ...currentJob.sub_attr].map(key =>
                    [key.toUpperCase(), current[key], next[key]]
                ),
                [attackLabel, current.attack, next.attack],
                ...[["damage", "伤害%"], ["boss", "BOSS伤害%"],
                    ["crit_damage", "暴击伤害%"], ["final_damage", "最终伤害%"],
                    ["ied", "无视防御%"]]
                    .map(([key, label]) => [label, current[key], next[key]])
            ];
            const formatPanel = value => value.toLocaleString("zh-CN", {
                maximumFractionDigits: 4
            });
            renderPanel(panelFields.map(([label, before, after]) => [
                label,
                `${formatPanel(before)}${label.endsWith("%") ? "%" : ""}`,
                `${formatPanel(after)}${label.endsWith("%") ? "%" : ""}`
            ]));
            renderSetList("beforeSets", beforeSets);
            renderSetList("afterSets", afterSets);
            $("result").hidden = false;
        } catch (error) {
            console.error("[装备收益] 计算失败", error);
            $("error").textContent = error.message;
        } finally {
            saveState();
        }
    };
    restoreState().then(() => {
        if (!$("result").hidden) {
            $("result").hidden = true;
            $("calculator").requestSubmit();
        }
    });
    fetch("sidebar.html")
        .then(response => {
            if (!response.ok) throw Error(`侧栏加载失败：${response.status}`);
            return response.text();
        })
        .then(html => {
            $("sidebar-container").innerHTML = html;
        })
        .catch(error => {
            console.error("加载侧栏失败:", error);
        });
    function toggleSubMenu(id) {
        const submenu = $(id);
        if (submenu) {
            submenu.style.display = submenu.style.display === "block" ? "none" : "block";
        }
    }
</script>
</body>
</html>
