<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/MaplestoryWiki/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/MaplestoryWiki/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六转进度计算器</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #f0f9ff, #e0f7fa);
            color: #000;
            margin: 0;
            padding: 10px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #000;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .form-group {
            background-color: #ffffffcc;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            padding: 3px 6px;
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 3px 6px;
            align-items: center;
            justify-content: space-between;
        }

        label {
            font-weight: bold;
            color: #000;
            font-size: 14px;
            margin-right: 8px;
        }

        input[type="number"] {
            padding: 6px 8px;
            border: 1px solid #b2dfdb;
            border-radius: 6px;
            width: 65px;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #00796b;
            outline: none;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #00796b;
            color: white;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 121, 107, 0.2);
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #004d40;
        }

        .result {
            flex: 1 1 30%;
            padding: 4px 0;
            font-size: 13px;
            color: #000;
            font-weight: bold;
        }

        .kong25 {
            width: 20%;
            box-sizing: border-box;
        }

        .input-group {
            width: 20%;
            box-sizing: border-box;
        }

        .inputone {
            padding: 6px 8px;
            border: 1px solid #b2dfdb;
            border-radius: 6px;
            width: 25px;
            font-size: 14px;
            font-weight: bold;
            color: #000;
        }

        .skillname-label {
            font-weight: bold;
            font-size: 14px;
            color: #000;
        }

        .needfrag-label {
            font-size: 12px;
            color: #000;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .form-group {
                flex-direction: column;
                align-items: flex-start;
            }

            .result {
                flex: 1 1 100%;
            }

            input[type="number"],
            .inputone {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- JavaScript 动态加载左侧目录 -->
    <div id="sidebar-container"></div>
    <div class="content">

        <div class="form-group">
            <div class="input-group">

            </div>
            <div class="input-group">

            <div class="input-group">
                <input id="enhancementLevel1" class="level-input" type="number" min="0" max="30" step="1" required>

                    required>

        <div class="form-group">

                <label class="skillname-label" id="enhanceLabel2">五转强化2</label>
            </div>
            <div class="input-group">

            <div class="input-group">

            <div class="input-group">

        </div>
        <div class="form-group">
            <div class="input-group">

        <div class="form-group">
            <div class="input-group">

            </div>
            <div class="input-group">

            <div class="input-group">

        <div class="form-group">

            </div>
            <div class="input-group">
                <label class="needfrag-label" id="remaincommon3frags"></label>
            </div>
            <div class="input-group">
                <input id="common3Level" class="level-input" type="number" min="0" max="30" step="1" required>
            </div>
            <div class="input-group">
                <input id="objectcommon3Level" class="object-input" type="number" min="0" max="30" step="1" required>

        </div>
        <div class="form-group">
            <div class="input-group">
                <label for="remainFragments">剩余碎片</label>
            </div>
            <div class="input-group">
            </div>
            <div class="input-group">
            </div>
            <div class="input-group">
                <input id="remainFragments" class="inputone" type="number" min="0" step="1" required>
            </div>
        </div>
        <div class="form-group">
            <div class="input-group">
                <label class="soul-label">剩余灵魂</label>
            </div>
            <div class="input-group">
            </div>
            <div class="input-group">
            </div>
            <div class="input-group">
                <input id="currentsoul" class="inputone" type="number" min="0" step="1" required>
            </div>
        </div>
        <button class="btn" onclick="calculate()">计算</button>
        <div class="form-group">
            <div class="result">
                <p>获取碎片总计: <span id="currentConsumedLabel">0</span></p>
            </div>
            <div class="result">
                <p>还需碎片: <span id="needFragsLabel">0</span></p>
            </div>
            <div class="result">
                <p>碎片進度: <span id="fragsProgressLabel">0%</span></p>
            </div>
        </div>
        <div class="form-group">
            <div class="result">
                <p>获取灵魂总计: <span id="currentConsumedSoulLabel">0</span></p>
            </div>
            <div class="result">
                <p>还需灵魂: <span id="needSoulLabel">0</span></p>
            </div>
            <div class="result">
                <p>灵魂进度: <span id="soulProgressLabel">0%</span></p>
            </div>
        </div>
    </div>
    <script>
        // 每项数组依次表示升至 1～30 级的消耗。
        const costs = {
            origin: {
                fragments: [100, 30, 35, 40, 45, 50, 55, 60, 65, 200, 80, 90, 100, 110, 120, 130, 140, 150, 160, 350, 170, 180, 190, 200, 210, 220, 230, 240, 250, 500, 0],
                souls: [5, 1, 1, 1, 2, 2, 2, 3, 3, 10, 3, 3, 4, 4, 4, 4, 4, 4, 5, 15, 5, 5, 5, 5, 5, 6, 6, 6, 7, 20]
            },
            mastery: {
                fragments: [50, 15, 18, 20, 23, 25, 28, 30, 33, 100, 40, 45, 50, 55, 60, 65, 70, 75, 80, 175, 85, 90, 95, 100, 105, 110, 115, 120, 125, 250, 0],
                souls: [3, 1, 1, 1, 1, 1, 1, 2, 2, 5, 2, 2, 2, 2, 2, 2, 2, 2, 3, 8, 3, 3, 3, 3, 3, 3, 3, 3, 4, 10]
            },
            enhancement: {
                fragments: [75, 23, 27, 30, 34, 38, 42, 45, 49, 150, 60, 68, 75, 83, 90, 98, 105, 113, 120, 263, 128, 135, 143, 150, 158, 165, 173, 180, 188, 375, 0],
                souls: [4, 1, 1, 1, 2, 2, 2, 3, 3, 8, 3, 3, 3, 3, 3, 3, 3, 3, 4, 12, 4, 4, 4, 4, 4, 5, 5, 5, 6, 15]
            },
            common: {
                fragments: [125, 38, 44, 50, 57, 63, 69, 75, 82, 300, 110, 124, 138, 152, 165, 179, 193, 207, 220, 525, 234, 248, 262, 275, 289, 303, 317, 330, 344, 750, 0],
                souls: [7, 2, 2, 2, 3, 3, 3, 5, 5, 14, 5, 5, 6, 6, 6, 6, 6, 6, 7, 17, 7, 7, 7, 7, 7, 9, 9, 9, 10, 20]
            },
            origin3: {
                fragments: [140, 21, 26, 30, 34, 38, 43, 47, 51, 142, 62, 69, 77, 83, 91, 98, 105, 112, 120, 252, 128, 136, 145, 152, 161, 168, 177, 184, 193, 357],
                souls: [7, 1, 1, 1, 1, 2, 2, 2, 2, 8, 2, 2, 3, 3, 3, 3, 3, 3, 3, 12, 4, 4, 4, 4, 4, 4, 5, 5, 5, 14]
            },
            common3: {
                fragments: [90, 25, 30, 35, 40, 45, 50, 55, 60, 180, 73, 81, 90, 98, 107, 115, 124, 132, 141, 315, 151, 160, 170, 179, 189, 198, 208, 217, 227, 450],
                souls: [4, 1, 1, 1, 2, 2, 2, 3, 3, 9, 3, 3, 3, 3, 4, 4, 4, 4, 4, 14, 4, 5, 5, 5, 5, 5, 5, 5, 6, 18]
            },
        };

        // current 同时作为 DOM ID 和原有 localStorage 键；目标 ID 使用 object 前缀。
        const cores = [
            { current: 'skillLevel', output: 'remainskillfrags', cost: 'origin', fallback: 1 },
            { current: 'skill2Level', output: 'remainskill2frags', cost: 'origin', fallback: 0 },
            { current: 'masterLevel1', output: 'remainmasterfrags1', cost: 'mastery', fallback: 0 },
            { current: 'masterLevel2', output: 'remainmasterfrags2', cost: 'mastery', fallback: 0 },
            { current: 'masterLevel3', output: 'remainmasterfrags3', cost: 'mastery', fallback: 0 },
            { current: 'masterLevel4', output: 'remainmasterfrags4', cost: 'mastery', fallback: 0 },
            { current: 'enhancementLevel1', output: 'remainenhancefrags1', cost: 'enhancement', fallback: 0 },
            { current: 'enhancementLevel2', output: 'remainenhancefrags2', cost: 'enhancement', fallback: 0 },
            { current: 'enhancementLevel3', output: 'remainenhancefrags3', cost: 'enhancement', fallback: 0 },
            { current: 'enhancementLevel4', output: 'remainenhancefrags4', cost: 'enhancement', fallback: 0 },
            { current: 'commonLevel', output: 'remaincommonfrags', cost: 'common', fallback: 0 },
            { current: 'common2Level', output: 'remaincommon2frags', cost: 'common', fallback: 0 },
            { current: 'skill3Level', output: 'remainskill3frags', cost: 'origin3', fallback: 0 },
            { current: 'common3Level', output: 'remaincommon3frags', cost: 'common3', fallback: 0 },
        ];

        const fields = [
            ...cores.flatMap(core => [core.current, `object${core.current}`]),
            'remainFragments', 'currentsoul'
        ];

        function saveToStorage() {
            fields.forEach(id => localStorage.setItem(id, document.getElementById(id).value));
        }

        function loadFromStorage() {
            fields.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = localStorage.getItem(id) || 0;
            });
        }

        function readNumber(id, fallback = 0) {
            return parseInt(document.getElementById(id).value) || fallback;
        }

        function readInputs() {
            return {
                levels: cores.map(core => ({
                    current: readNumber(core.current, core.fallback),
                    target: readNumber(`object${core.current}`, core.fallback)
                })),
                fragments: readNumber('remainFragments'),
                souls: readNumber('currentsoul')
            };
        }

        function sumCost(values, level) {
            return values.slice(0, level).reduce((total, value) => total + value, 0);
        }

        function calculateCore(core, levels) {
            const target = Math.max(levels.current, levels.target);
            const cost = costs[core.cost];
            const consumed = {
                fragments: sumCost(cost.fragments, levels.current),
                souls: sumCost(cost.souls, levels.current)
            };
            const required = {
                fragments: sumCost(cost.fragments, target),
                souls: sumCost(cost.souls, target)
            };
            return {
                output: core.output,
                consumed,
                required,
                remaining: {
                    fragments: required.fragments - consumed.fragments,
                    souls: required.souls - consumed.souls
                }
            };
        }

        // 纯计算：不读取 DOM，不写入存储，也不修改输入。
        function calculateProgress(input) {
            const details = cores.map((core, index) => calculateCore(core, input.levels[index]));
            const totals = details.reduce((total, detail) => ({
                fragments: total.fragments + detail.consumed.fragments,
                souls: total.souls + detail.consumed.souls,
                targetFragments: total.targetFragments + detail.required.fragments,
                targetSouls: total.targetSouls + detail.required.souls
            }), { fragments: 0, souls: 0, targetFragments: 0, targetSouls: 0 });

            totals.fragments += input.fragments;
            totals.souls += input.souls;
            return {
                details,
                fragments: summarizeProgress(totals.fragments, totals.targetFragments),
                souls: summarizeProgress(totals.souls, totals.targetSouls)
            };
        }

        function summarizeProgress(acquired, target) {
            return {
                acquired,
                remaining: Math.max(0, target - acquired),
                progress: ((acquired / target) * 100).toFixed(2) + '%'
            };
        }

        function renderResults(result) {
            result.details.forEach(detail => {
                const { consumed, remaining } = detail;
                document.getElementById(detail.output).innerText =
                    `已消耗:${consumed.souls}/${consumed.fragments} 还需:${remaining.souls}/${remaining.fragments}`;
            });
            const labels = {
                currentConsumedLabel: result.fragments.acquired,
                currentConsumedSoulLabel: result.souls.acquired,
                needFragsLabel: result.fragments.remaining,
                needSoulLabel: result.souls.remaining,
                fragsProgressLabel: result.fragments.progress,
                soulProgressLabel: result.souls.progress
            };
            Object.entries(labels).forEach(([id, value]) => {
                document.getElementById(id).innerText = value;
            });
        }

        function calculate() {
            const input = readInputs();
            // 计算、显示和存储统一使用上限处理后的灵魂库存。
            if (input.souls > 20) {
                input.souls = 20;
                document.getElementById('currentsoul').value = 20;
            }
            const result = calculateProgress(input);
            renderResults(result);
            saveToStorage();
        }

        window.onload = function () {
            loadFromStorage();
            calculate();
        };

        // 加载侧边栏
        fetch('sidebar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('sidebar-container').innerHTML = data;
            })
            .catch(error => {
                console.error('加载侧边栏失败:', error);
            });

        // JavaScript 控制子菜单的展开和收起
        function toggleSubMenu(id) {
            const submenu = document.getElementById(id);
            if (submenu.style.display === "block") {
                submenu.style.display = "none";
            } else {
                submenu.style.display = "block";
            }
        }
    </script>
</body>

</html>
